<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07392c" />
    <meta name="description" content="Discover thoughtful fashion jewellery from Lavéra. Shine with elegance." />
    <title>Lavéra — Shine with elegance</title>
  </head>
  <body>
    <form name="product-enquiry" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="product-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <select name="category"><option>Earrings</option><option>Necklaces</option><option>Rings</option><option>Bracelets</option></select>
      <input name="product-reference" />
      <input name="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
    </form>
    <div id="initial-loader" role="status" aria-label="Loading Lavéra">
      <span class="loader-wordmark">Lavéra<span>✦</span></span>
      <span class="loader-track"><span></span></span>
      <span class="loader-caption">A little sparkle is on its way</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
